# yaml-language-server: $schema=./bundle-schema.json
---
bundle:
  name: alberta_enegery
experimental:
  skip_name_prefix_for_schema: true
include:
  - resources/*.yml
variables:
  catalog_name:
    description: "The catalog to work in"
  schema_name:
    description: "The schema to work in"
  volume_name:
    description: "The volume for raw data ingestion"
targets:
  default:
    default: true
    mode: development
    workspace:
      profile: fevm-az
    variables:
      catalog_name: classic_stable_ptbvhz_ip
      schema_name: alberta_energy
      volume_name: aeso_ingest
